name: Supabase Heartbeat

on:
  schedule:
    - cron: "13 */12 * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call heartbeat endpoint
        env:
          SUPABASE_HEARTBEAT_URL: ${{ secrets.SUPABASE_HEARTBEAT_URL }}
          CRON_API_SECRET: ${{ secrets.CRON_API_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_HEARTBEAT_URL:-}" ]; then
            echo "SUPABASE_HEARTBEAT_URL is not set." >&2
            exit 1
          fi

          response_file="$(mktemp)"
          status_code=""

          if [ -n "${CRON_API_SECRET:-}" ]; then
            status_code="$(curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --max-time 30 \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              -H "x-cron-secret: ${CRON_API_SECRET}" \
              "${SUPABASE_HEARTBEAT_URL}")"
          else
            status_code="$(curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-all-errors \
              --max-time 30 \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              "${SUPABASE_HEARTBEAT_URL}")"
          fi

          echo "HTTP status: ${status_code}"
          echo "Response body:"
          cat "${response_file}"

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -ge 300 ]; then
            echo "Heartbeat request failed." >&2
            exit 1
          fi
