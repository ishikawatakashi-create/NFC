name: Supabase Heartbeat

on:
  schedule:
    - cron: "13 */12 * * *"
  workflow_dispatch:

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call heartbeat endpoint
        env:
          SUPABASE_HEARTBEAT_URL: ${{ secrets.SUPABASE_HEARTBEAT_URL }}
          CRON_API_SECRET: ${{ secrets.CRON_API_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_HEARTBEAT_URL:-}" ]; then
            echo "SUPABASE_HEARTBEAT_URL is not set." >&2
            exit 1
          fi

          if [ -n "${CRON_API_SECRET:-}" ]; then
            curl \
              --fail \
              --show-error \
              --silent \
              --retry 3 \
              --retry-all-errors \
              --max-time 30 \
              -H "x-cron-secret: ${CRON_API_SECRET}" \
              "${SUPABASE_HEARTBEAT_URL}"
          else
            curl \
              --fail \
              --show-error \
              --silent \
              --retry 3 \
              --retry-all-errors \
              --max-time 30 \
              "${SUPABASE_HEARTBEAT_URL}"
          fi
